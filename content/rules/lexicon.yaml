# Layer-1 tripwire patterns (docs/context/07). Compiled once, case-insensitive, Unicode-aware.
# A hit is only "possible": the background LLM layer confirms or withdraws it with context.
#
# `{b}` is a word boundary that understands Indic scripts. Python's \b breaks inside Devanagari,
# Bengali and Tamil words because their vowel signs are not "word" characters, so never use \b.
#
# Every PATTERN has its own `positive` examples (each must match this pattern) and tricky
# `negative` near-misses (none may raise this rule). Unit tests run all of them.
# Coverage: Hinglish (Latin + Devanagari), English, Tanglish (Latin + Tamil script) and
# Benglish (Latin + Bengali script); the Tamil and Bengali sets came with Lakshmi and Debu (P4.1).
version: 3
rules:
  threat:
    patterns:
      - pattern: '{b}(police|polis|पुलिस|পুলিশ|போலீஸ்)\s*(ko\s*|को\s*)?(bhej|भेज|bula|बुला|aayegi|आएगी|aa\s*jayegi|aa\s*jaegi|le\s*jayegi|pathabo|pathiye|পাঠাবো|varuvanga)'
        positive: ["police bhej dunga aapke ghar", "पुलिस भेज दूंगा", "Police pathabo, bujhecho?"]
        negative: ["aap police complaint kar sakte hain agar koi pareshan kare"]
      - pattern: '{b}(police|polis|पुलिस)\s*(mein\s*|में\s*|me\s*)?(complaint|case|शिकायत|kes)\s*(kar|कर)\s*(dunga|dungi|denge|दूंगा|दूंगी|देंगे|rahe\s*hain|रहे\s*हैं)'
        positive: ["main police mein complaint kar dunga"]
        negative: ["police mein complaint karna aapka haq hai"]
      - pattern: '{b}(fir|f\.i\.r\.?|एफआईआर|एफ\.आई\.आर)\s*(karwa|karva|करवा|kar\s*denge|kar\s*dunga|darj|दर्ज|ho\s*jayegi|hogi|होगी)'
        positive: ["FIR karwa denge aaj hi"]
        negative: ["first payment confirm ho gaya hai"]
      - pattern: '{b}(jail|jel|जेल)\s*(bhej|भेज|ho\s*(jayegi|jaegi|jaayegi)|hogi|होगी|हो\s*जाएगी|daal|डाल|mein\s*daal|jaoge|jaaoge|जाओगे)'
        positive: ["jail ho jayegi aapko"]
        negative: ["jail road wali branch mein payment ho sakta hai"]
      - pattern: '{b}(log|aadmi|ladke|bande|banda|team|recovery\s*agent|लोग|आदमी|लड़के|टीम)\s*(ko\s*)?(bhej|भेज)\w*'
        positive: ["hamare log bhejenge aapke paas"]
        negative: ["main aapko payment link bhej deti hoon"]
      - pattern: '{b}(ghar|घर|office|ऑफिस|daftar|दफ्तर|veedu|veettu|bari)\s*(pe|par|पर|tak|तक|ku)?\s*(aa\s*jayenge|aa\s*jaenge|aayenge|आ\s*जाएंगे|आएंगे|pahunch\s*jayenge|पहुंच\s*जाएंगे|varuvom|jabo)'
        positive: ["kal ghar pe aa jayenge hum"]
        negative: ["ghar pe sab theek hai?"]
      - pattern: '{b}(padosi|padosiyon|पड़ोसी|पड़ोसियों|rishtedar|rishtedaron|रिश्तेदार|mohalle|मोहल्ले|boss|employer)\w*\s*(ko|को|se|से)\s*(bata|बता|bol|बोल)\w*'
        positive: ["aapke padosiyon ko bata denge"]
        negative: ["padosi ne bataya ki aap bahar gaye hain"]
      - pattern: '{b}(dekh\s*(lunga|loonga|lenge|lungi)|देख\s*(लूंगा|लेंगे|लूंगी))'
        positive: ["main aapko dekh lunga"]
        negative: ["main dekh leti hoon aapka account"]

      # Tanglish + Tamil script (P4.1)
      - pattern: '{b}(police|polis|போலீஸ்)\s*-?\s*(ku|kku|la|கு|ல)?\s*(complaint|case|கம்ப்ளைண்ட்|கேஸ்)\s*(kudupom|kuduppom|kudukkurom|podurom|poduvom|கொடுப்போம்|போடுவோம்)'
        positive: ["naanga police-la case podurom", "போலீஸ்ல கேஸ் போடுவோம்"]
        negative: ["police-la complaint kudukka ungalukku urimai irukku"]
      - pattern: '{b}(veetukku|veettukku|veettuku|வீட்டுக்கு|kadaikku|கடைக்கு|shop-ku)\s*(aal|aalunga|aatkal|ஆள்|ஆட்கள்)?\s*(anuppuvom|anupuvom|varuvom|vandhuduvom|அனுப்புவோம்|வருவோம்)'
        positive: ["naalaikku veetukku aal anuppuvom", "நாளைக்கு கடைக்கு வருவோம்"]
        negative: ["veetukku poyitu call pannunga madam"]
      - pattern: '{b}(jail|ஜெயில்|ஜெயிலு|சிறை|சிறைக்)\s*-?\s*(ku|kku|க்கு|க்கு)?\s*(poveenga|poga\s*vendi\s*varum|anuppuvom|போவீங்க|அனுப்புவோம்)'
        positive: ["pay pannalana jail-ku poveenga", "ஜெயிலுக்கு போவீங்க"]
        negative: ["jail road branch-la kooda pay pannalam"]
      - pattern: '{b}(pakkathu\s*veettu|pakkathu\s*veetu|neighbours?|பக்கத்து\s*வீட்டு)\w*\s*(kitta|கிட்ட)\s*(solluvom|solliduvom|சொல்லுவோம்|சொல்லிடுவோம்)'
        positive: ["pakkathu veettu kitta solluvom", "பக்கத்து வீட்டு கிட்ட சொல்லிடுவோம்"]
        negative: ["pakkathu veettu kitta yaaravadhu irukkangala?"]
      # Benglish + Bengali script (P4.1)
      - pattern: '{b}(police|polis|পুলিশ)\s*-?\s*(e|এ|ে)?\s*(complaint|case|কেস|অভিযোগ)\s*(korbo|kore\s*debo|করব|করে\s*দেব)'
        positive: ["Police-e case korbo apnar naame", "পুলিশে কেস করব"]
        negative: ["police-e complaint korar odhikar apnar ache"]
      - pattern: '{b}(lok|loke|chele|chhele|লোক|ছেলে)\s*(ra\s*|der\s*|রা\s*)?(pathabo|pathiye\s*debo|পাঠাবো|পাঠিয়ে\s*দেব)'
        positive: ["amader chhele pathiye debo", "লোক পাঠাবো কাল"]
        negative: ["link ta pathiye debo, dekhe nin"]
      - pattern: '{b}(bari|barite|office|offic-e|অফিস|অফিসে)\s*(te\s*|e\s*)?(chole\s*jabo|giye\s*dhorbo|asbo|চলে\s*যাব|আসব)'
        positive: ["kal office e chole jabo amra", "অফিসে চলে যাব"]
        negative: ["bari giye call korun, kono chinta nei"]
      - pattern: '{b}(jail|jel|জেল)\s*-?\s*(e|এ|ে)?\s*(jaben|jete\s*hobe|dhukiye\s*debo|যাবেন|যেতে\s*হবে)'
        positive: ["taka na dile jail-e jete hobe", "জেলে যাবেন"]
        negative: ["jail road-er branch-e jama korte paren"]
      - pattern: '{b}(protibeshi|প্রতিবেশী)\w*\s*(der|ke|দের|কে)?\s*(bole\s*debo|janabo|বলে\s*দেব|জানাব)'
        positive: ["protibeshider bole debo", "প্রতিবেশীদের বলে দেব"]
        negative: ["protibeshi bollen apni bari nei"]

  abuse:
    patterns:
      - pattern: '{b}(kamina|kamine|kaminey|haramkhor|haraamkhor|saala|saale|saali|kutta|kutte|kuttey|harami|कमीना|कमीने|हरामखोर|साला|साले|कुत्ता|कुत्ते|हरामी|শালা|হারামি){b}'
        positive: ["साले पैसे दे", "तू साला। पैसे दे"]
        negative: ["saalana interest kitna hai?"]
      - pattern: '{b}(aap|tum|tu|आप|तुम|तू)\s*((to|toh|ek|bilkul|bahut|तो|एक|बिल्कुल)\s*){0,2}(bewakoof|bevkoof|bewkoof|gadhe|gadha|ullu|chor|beimaan|nikamme|nikamma|nalayak|besharam|fraud|liar|idiot|stupid|loser|बेवकूफ|गधे|गधा|उल्लू|चोर|बेईमान|निकम्मे|नालायक|बेशर्म){b}(?=\s*(ho|hai|hain|nikle|हो|है|हैं|निकले){b}|\s*[,.!?।]|\s*$)'
        positive: ["aap to bilkul bewakoof ho", "tum chor ho, paisa khaa gaye", "तुम बेशर्म हो"]
        negative: ["main aapko chor nahi bol rahi", "aap fraud calls se savdhan rahein"]
      - pattern: '{b}(you\s*(are\s*)?(an?\s*)?|you.re\s*(an?\s*)?)(idiot|stupid|shameless|liar|loser|fraud|useless){b}'
        positive: ["you are a liar, sir"]
        negative: ["you are not a fraud, I know, there was a bank error"]
      - pattern: '{b}(sharam\s*nahi\s*aati|शर्म\s*नहीं\s*आती|shame\s*on\s*you)'
        positive: ["aapko sharam nahi aati?"]
        negative: ["shame on me, maine galat amount bataya"]

      # Tanglish + Tamil script (P4.1)
      - pattern: '{b}(loosu|muttaal|muttal|porukki|poramboku|naaye|முட்டாள்|பொறுக்கி|லூசு|நாயே){b}'
        positive: ["neenga oru muttaal madam", "லூசு மாதிரி பேசாதீங்க"]
        negative: ["muttai vaangitu varuvom", "loose connection irukku phone-la"]
      - pattern: '{b}(vekkama\s*illaya|vekkam\s*illaya|vetkam\s*illaya|maanam\s*illaya|வெட்கம்\s*இல்லையா|மானம்\s*இல்லையா)'
        positive: ["ungalukku vekkam illaya?", "வெட்கம் இல்லையா?"]
        negative: ["vekkam padaadheenga, naanga help panrom"]
      # Benglish + Bengali script (P4.1)
      - pattern: '{b}(chhagol|chagol|haramjada|boka\s*choda|gadhar\s*baccha|ছাগল|হারামজাদা|গাধা|বোকা){b}'
        positive: ["apni ekta chhagol", "হারামজাদা, টাকা দে"]
        negative: ["chhagoler mangsho kinte gechilen?", "bokaya taka ta koto?"]
      - pattern: '{b}(lojja\s*(kore\s*)?na|লজ্জা\s*(করে\s*)?না)'
        positive: ["apnar lojja kore na?", "লজ্জা করে না?"]
        negative: ["lojja paben na, amra help korbo"]

  misleading:
    patterns:
      - pattern: '{b}(cibil|सिबिल)\s*(score\s*|स्कोर\s*)?(zero|0|khatam|khatm|ख़त्म|खत्म|block|blacklist|ज़ीरो|जीरो)'
        positive: ["aapka CIBIL zero ho jayega forever", "सिबिल स्कोर ख़त्म हो जाएगा"]
        negative: ["late payment se CIBIL score pe asar pad sakta hai"]
      - pattern: '{b}(kabhi|zindagi\s*bhar|life\s*mein|lifetime|कभी|ज़िंदगी\s*भर|जिंदगी\s*भर).{0,25}(loan|लोन)\s*(nahi|नहीं)\s*(milega|मिलेगा)'
        positive: ["zindagi bhar koi loan nahi milega aapko"]
        negative: ["zindagi mein sabke saath aisa hota hai sir"]
      - pattern: '{b}(arrest|giraftaar|giraftar|गिरफ्तार|गिरफ़्तार)\w*'
        positive: ["aapko arrest kar lenge"]
        negative: ["aap restructuring ke liye apply kar sakte hain"]
      - pattern: '{b}(warrant|वारंट)\s*(nikal|निकल|jaari|जारी|aa|आ)'
        positive: ["warrant nikal jayega kal tak"]
        negative: ["warranty card bhi bhej dijiye gaadi ka"]
      - pattern: '{b}(blacklist|black\s*list|ब्लैकलिस्ट)\w*'
        positive: ["aapko blacklist kar denge"]
        negative: ["black colour ki scooty hai na aapki?"]
      - pattern: '{b}(ghar|घर|property|zameen|jameen|ज़मीन|जमीन)\s*(zabt|jabt|seize|kurk|कुर्क|जब्त|ज़ब्त)'
        positive: ["ghar zabt ho jayega aapka"]
        negative: ["ghar ka kiraya bhi dena hota hai, samajh sakti hoon"]
      # Tanglish + Tamil script (P4.1)
      - pattern: '(சிபில்)\s*(ஸ்கோர்\s*)?(ஜீரோ|போயிடும்|zero)'
        positive: ["உங்க சிபில் ஸ்கோர் ஜீரோ ஆயிடும்"]
        negative: ["சிபில் ஸ்கோர் கொஞ்சம் குறையலாம்"]
      - pattern: '{b}(inimel|inime|vaazhnaal|வாழ்நாள்|இனிமேல்|life-la|lifela).{0,25}(loan|லோன்|kadan|கடன்)\s*(kidaikkaadhu|kidaikathu|kidaikaadhu|கிடைக்காது)'
        positive: ["inimel ungalukku loan kidaikkaadhu", "இனிமேல் கடன் கிடைக்காது"]
        negative: ["loan kidaikkum, konjam time aagum"]
      - pattern: '{b}(kaidhu|kaithu|கைது|greftar|grephtar|greptar|গ্রেফতার|গ্রেপ্তার)\w*'
        positive: ["kaidhu pannuvanga", "apnake greftar korbe", "গ্রেফতার হবেন"]
        negative: ["kaithari saree romba nalla irukku", "greeting card pathiyechi"]
      # Benglish + Bengali script (P4.1)
      - pattern: '(সিবিল)\s*(স্কোর\s*)?(শূন্য|জিরো|শেষ|zero)'
        positive: ["সিবিল স্কোর শূন্য হয়ে যাবে"]
        negative: ["সিবিল স্কোর একটু কমতে পারে"]
      - pattern: '{b}(ar\s*kono\s*din|kono\s*din|jiboneo|জীবনে|আর\s*কোনো).{0,25}(loan|লোন|ঋণ)\s*(paben\s*na|pabe\s*na|পাবেন\s*না)'
        positive: ["jiboneo ar loan paben na", "জীবনে আর লোন পাবেন না"]
        negative: ["loan paben, ektu somoy lagbe"]
